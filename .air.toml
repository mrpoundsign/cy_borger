root = "."
testdata_dir = "testdata"
tmp_dir = "tmp/air"

[build]
  cmd = "./tools/build.sh -o ./tmp/cy_borger"
  bin = "./tmp/cy_borger"
  exclude_file = ["playwright.config.js" ]
  exclude_regex = ["_test.go", ".min.css"]
  exclude_dir = ["tests", "tmp", "local"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "js", "css", "templ"]
  include_file = []
  kill_delay = "5s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true

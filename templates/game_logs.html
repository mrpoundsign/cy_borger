<div id="activity-log-box" style="margin-top:15px; background:#050505; border:1px solid #333; padding:15px; max-height:300px; overflow-y:auto; font-family:monospace; font-size:0.85rem;" 
    hx-include="#log-filter-form"
    hx-get="/game/{{.Game.ID}}/logs" hx-swap="outerHTML">
    {{range .Logs}}
    {{$logCharID := .CharacterID}}
    <div class="log-entry" data-type="{{.EventType}}" style="margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid #222; display:flex; gap:10px;">
        <div style="color:var(--muted-color); white-space:nowrap;">[{{.CreatedAt.Format "15:04:05"}}]</div>
        <div style="color:#fff;">
            {{range $.Characters}}{{if eq .ID $logCharID}}<strong style="color:var(--accent-color);">{{if .Name}}{{.Name}}{{else}}[UNNAMED]{{end}}</strong>{{end}}{{end}}
            <span style="color:#aaa;">{{.Message}}</span>
        </div>
    </div>
    {{end}}
    {{if not .Logs}}
    <div style="color:#555; font-style:italic;">No logged activity yet...</div>
    {{end}}
</div>

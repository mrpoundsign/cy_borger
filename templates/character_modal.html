<div class="modal-overlay" id="char-modal" data-char-id="{{.Character.ID}}" onclick="if(event.target === this) this.remove();">
    <div class="modal-content">
        <button class="btn-outline" style="float:right; color:#ff3366; border-color:#ff3366;" onclick="document.getElementById('char-modal').remove()">✕ CLOSE</button>
        {{template "character.html" .}}
    </div>
</div>
<style>
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        overflow-y: auto;
        padding: 20px;
    }

    .modal-content {
        background: #050505;
        border: 2px solid var(--accent-color);
        max-width: 1100px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        padding: 25px;
        box-shadow: 0 0 30px rgba(255, 230, 0, 0.4);
    }
</style>

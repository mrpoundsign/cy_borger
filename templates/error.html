<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.StatusCode}} - ERROR</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #ff0055;
            --text-color: #ffffff;
            --muted-color: #888888;
            --border-color: #ff0055;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            border: 2px solid var(--border-color);
            padding: 40px 30px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            background: #0a0a0a;
        }

        h1 {
            color: var(--accent-color);
            font-size: 5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(255,0,85,0.5);
        }
        
        h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        p {
            color: var(--muted-color);
            margin-bottom: 30px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .btn {
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 15px var(--accent-color);
        }
        
        .glitch-block {
            background: #111;
            border: 1px dashed var(--muted-color);
            padding: 15px;
            font-size: 0.9rem;
            color: #ff9900;
            margin-bottom: 30px;
            text-align: left;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>{{.StatusCode}}</h1>
        <h2>SYSTEM ERROR</h2>
        
        <div class="glitch-block">
            > EXCEPTION CAUGHT IN MAIN LOOP<br>
            > DETAILS: {{.ErrorMessage}}<br>
            > ALERT LEVEL: ELEVATED<br>
        </div>

        <p>Something went wrong on the grid. Verify your credentials or the terminal link.</p>

        <a href="/" class="btn">⬅️ JACK OUT TO MAIN MENU</a>
    </div>
</body>

</html>
